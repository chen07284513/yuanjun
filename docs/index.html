<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>援军观察</title>
<meta name="theme-color" content="#14171f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="援军观察">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f2ee; --card:#fff; --ink:#1c1f26; --mute:#6b7280; --line:#e7e3dc;
  --up:#d9363e; --down:#16a34a; --accent:#14171f; --gold:#b7791f; --chip:#efece6;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;
  padding:calc(var(--safe-top) + 12px) 16px 12px}
header h1{margin:0;font-size:19px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
header h1 small{font-size:12px;font-weight:400;opacity:.65}
header .sub{font-size:12px;opacity:.75;margin-top:2px}
main{padding:12px 12px calc(84px + var(--safe-bot));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe-bot)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--mute);
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ink);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.banner{background:#fff7e6;border:1px solid #f3d9a4;color:#7a4d00;border-radius:12px;padding:10px 12px;
  font-size:13px;margin-bottom:10px}
.banner.info{background:#eef2ff;border-color:#d6defc;color:#2b3a75}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.grid3 span{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stock .nm{font-size:17px;font-weight:600}
.stock .cd{color:var(--mute);font-size:13px;margin-left:6px;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--chip);color:#4b5160}
.tag.strict{background:#fdecc8;color:#7a4d00;font-weight:600}
.tag.ok{background:#fde8e8;color:var(--up)}
.tag.no{background:#f1f1f1;color:#9aa0a6;text-decoration:line-through}
.tag.bf{background:#e8eefc;color:#2b3a75}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;margin-top:10px}
.kv div{background:#faf9f6;border-radius:8px;padding:6px 8px}
.kv span{display:block;font-size:11px;color:var(--mute)}
.kv b{font-size:15px;font-variant-numeric:tabular-nums}
.kv span.up{color:var(--up)} .kv span.down{color:var(--down)}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;border-radius:10px;padding:10px 0;font-size:14px;font-weight:600}
.btn.main{background:var(--up);color:#fff}
.btn.sec{background:var(--chip);color:var(--ink)}
.up{color:var(--up)} .down{color:var(--down)} .mute{color:var(--mute)}
.small{font-size:12px} .h2{font-size:16px;font-weight:700;margin:16px 4px 8px}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .l b{font-weight:600}
.list .r{text-align:right;font-variant-numeric:tabular-nums}
.list .r b{font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;border-top:0}
.verdict{border-left:4px solid var(--up);padding-left:10px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
p{margin:6px 0} ol,ul{padding-left:20px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-bot));transform:translateX(-50%);
  background:rgba(20,23,31,.92);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:86%;text-align:center}
.toast.show{opacity:1}
.idx{display:flex;align-items:center;gap:10px;margin-top:8px}
.idx .num{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.idx .bar{flex:1;height:8px;background:#eee9e0;border-radius:6px;overflow:hidden}
.idx .bar i{display:block;height:100%;border-radius:6px}
.tier-高{color:var(--up)} .tier-中{color:var(--gold)} .tier-低{color:var(--mute)}
.bg-高{background:var(--up)} .bg-中{background:var(--gold)} .bg-低{background:#b8b2a7}
.secchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.secchip{background:#fdecec;color:#9b1c22;border-radius:8px;padding:4px 8px;font-size:12px}
.secchip.cold{background:var(--chip);color:#4b5160}
.secchip.con{background:#eef2ff;color:#2b3a75}
.tag.res{background:#2b3a75;color:#fff;font-weight:600}
.conrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
details{margin-top:8px} summary{cursor:pointer;color:#2b3a75;font-size:13px}
.gaptbl td,.gaptbl th{padding:5px 4px;font-size:12px}
.gaptbl tr.hit td{background:#fff3d6;font-weight:600}
.vd{border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13px}
.vd.buy{background:#fde8e8;color:#9b1c22} .vd.skip{background:#f1f1f1;color:#555}
.preview{background:#14171f;color:#ffd78a;font-size:12px;text-align:center;padding:6px}
</style>
</head>
<body>
<div id="preview" class="preview" hidden></div>
<header>
  <h1>援军观察 <small>模拟盘 · 非投资建议</small></h1>
  <div class="sub" id="sub">加载中…</div>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-tab="sb" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M6 16l4-5 3 3 5-7"/><path d="M15 7h3v3"/></svg>涨停</button>
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>援军</button>
  <button data-tab="paper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>模拟盘</button>
  <button data-tab="bt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="3" height="9"/><rect x="10.5" y="5" width="3" height="14"/><rect x="17" y="13" width="3" height="6"/></svg>回测</button>
  <button data-tab="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>说明</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const S = { tab: "sb", sbTrades: null, sb: null, sbView: "first", todayFilter: "all", paperGroup: "base", paperBackfill: true, btGroup: "strict",
            latest: null, trades: null, bt: null, err: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (x, d = 1, sign = true) => {
  if (x == null) return "—";
  const v = Number((x * 100).toFixed(d));
  return (sign && v > 0 ? "+" : "") + (v === 0 ? (0).toFixed(d) : v.toFixed(d)) + "%";
};
const cls = (x) => x == null ? "" : x > 0 ? "up" : x < 0 ? "down" : "";
const num = (x, d = 2) => x == null ? "—" : Number(x).toFixed(d);
const GN = { base: "原版", strict: "严格版" };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

async function copyCode(code) {
  try { await navigator.clipboard.writeText(code); return true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea"); ta.value = code; document.body.appendChild(ta);
      ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
    } catch (e2) { return false; }
  }
}
async function openThs(code) {
  const ok = await copyCode(code);
  toast(ok ? `已复制 ${code}，在同花顺搜索框粘贴即可` : `请在同花顺搜索 ${code}`);
  setTimeout(() => { window.location.href = "amihexin://"; }, 350);
}
async function onlyCopy(code) {
  toast((await copyCode(code)) ? `已复制 ${code}` : `复制失败，代码：${code}`);
}

async function load() {
  if (window.__DATA__) {
    Object.assign(S, window.__DATA__);
    if (window.__DATA__.previewNote) { const p = $("#preview"); p.hidden = false; p.textContent = window.__DATA__.previewNote; }
    return;
  }
  const get = async (f) => { const r = await fetch(`data/${f}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(f + " " + r.status); return r.json(); };
  try {
    const [latest, trades, bt] = await Promise.all([get("latest.json"), get("trades.json"), get("backtest.json")]);
    Object.assign(S, { latest, trades, bt });
    try { S.sb = await get("shouban.json"); } catch (e) {}
    try { S.sbTrades = await get("shouban_trades.json"); } catch (e) {}
  } catch (e) {
    try { S.bt = await get("backtest.json"); } catch (e2) {}
    S.err = "还没有每日数据。第一次自动运行完成后（交易日北京时间 16:40 之后）这里就会显示。";
  }
}

function trList() { return Object.values(S.trades?.trades || {}); }

// ------------------------------------------------------------------ 今日
function renderToday() {
  const L = S.latest;
  if (!L) return `<div class="banner info">${esc(S.err || "暂无数据")}</div>`;
  const m = L.market || {};
  let h = "";
  (L.notes || []).forEach(n => h += `<div class="banner">${esc(n)}</div>`);
  if (L.mode === "intraday") h += `<div class="banner info">盘中信号：用北京时间 ${esc((L.generated || "").slice(11))} 的价格计算。收盘前价格还会变，规则按这个价格在尾盘买入。</div>`;
  const yn = (v) => v == null ? `<span class="mute">未知</span>` : v ? `<span class="up">是</span>` : `<span class="down">否</span>`;
  h += `<div class="card"><div class="grid3">
      <div><b>${m.limit_ups ?? "—"}</b><span>当日涨停家数</span></div>
      <div><b>${yn(m.index_above_ma20)}</b><span>大盘在20日线上</span></div>
      <div><b>${yn(m.emotion_ok)}</b><span>情绪达标（严格版）</span></div>
    </div></div>`;
  const all = (L.today || []).map(k => S.trades?.trades?.[k]).filter(Boolean);
  const nStrict = all.filter(t => t.groups.includes("strict")).length;
  h += `<div class="chips">
      <button class="chip ${S.todayFilter === "all" ? "on" : ""}" data-tf="all">全部 ${all.length}</button>
      <button class="chip ${S.todayFilter === "strict" ? "on" : ""}" data-tf="strict">只看严格版 ${nStrict}</button></div>`;
  const list = (S.todayFilter === "strict" ? all.filter(t => t.groups.includes("strict")) : all)
    .sort((a, b) => (b.groups.includes("strict") - a.groups.includes("strict")) || (b.streak - a.streak) || (b.amount_yi - a.amount_yi));
  if (!list.length) {
    h += `<div class="card empty">今天没有符合条件的股票。<br><span class="small">这很正常：援军战法的信号很不均匀，有时连续几周都没有。</span></div>`;
  }
  list.forEach(t => h += stockCard(t));
  h += `<p class="small mute" style="margin:8px 4px">信号价 = 选股那一刻的价格（每个交易日约 14:40–14:50 运行），模拟盘按这个价格买入。止损 = 跌破撤军线；止盈 = +8%；最多持有 5 个交易日。</p>`;
  return h;
}

function stockCard(t) {
  const code = t.code.slice(2);
  const strict = t.groups.includes("strict");
  const b = t.badges || {};
  const stopDist = t.stop && t.entry ? t.stop / t.entry - 1 : null;
  return `<div class="card stock">
    <div class="row"><div><span class="nm">${esc(t.name || code)}</span>${t.name ? `<span class="cd">${code}</span>` : ""}</div>
      <div class="small mute">${t.streak}连板后回调 ${pct(t.dd, 0, false)}</div></div>
    <div class="tags">
      ${t.groups.includes("base") ? `<span class="tag">原版</span>` : ""}
      ${strict ? `<span class="tag strict">严格版</span>` : ""}
      <span class="tag ${b.emotion ? "ok" : "no"}">情绪</span>
      <span class="tag ${b.first_hold ? "ok" : "no"}">首板不破</span>
      <span class="tag ${b.vol_shrink ? "ok" : "no"}">缩量回调</span>
      ${t.backfill ? `<span class="tag bf">启动补录</span>` : ""}
      ${t.src === "收盘" ? `<span class="tag bf">收盘后补算</span>` : ""}
    </div>
    <div class="kv">
      <div><span>${t.src === "盘中" && t.entry_time ? "信号价 " + esc(t.entry_time) : "收盘价"}</span><b>${num(t.entry)}</b></div>
      <div><span>撤军线(止损)</span><b class="down">${num(t.stop)}</b><span class="down">${pct(stopDist)}</span></div>
      <div><span>止盈价</span><b class="up">${num(t.tp)}</b><span class="up">+8.0%</span></div>
    </div>
    <div class="btns">
      <button class="btn main" data-ths="${code}">在同花顺打开</button>
      <button class="btn sec" data-copy="${code}">复制代码</button>
    </div>
  </div>`;
}

// ------------------------------------------------------------------ 首板
function renderSb() {
  const B = S.sb;
  if (!B) return `<div class="banner info">首板数据还没生成。每个交易日 16:40 左右收盘后更新，9:26 左右用竞价价格再更新一次。</div>`;
  const seg = `<div class="chips"><button class="chip ${S.sbView === "first" ? "on" : ""}" data-sv="first">首板推荐</button>
    <button class="chip ${S.sbView === "ladder" ? "on" : ""}" data-sv="ladder">连板梯队 ${(B.ladder || []).length}</button></div>`;
  if (S.sbView === "ladder") return seg + renderLadder(B);
  return seg + renderFirst(B);
}

function renderLadder(B) {
  const L = (B.model || {}).ladder || {}, lv = {};
  (L.levels || []).forEach(x => lv[x.k] = x);
  const hist = (k) => lv[Math.min(k, 7)] || {};
  const g = L.grid || {};
  let h = `<div class="banner">回测结论：连板股<b>第二天开盘追买，每个高度平均都是亏的</b>（2板每笔 ${pct(hist(2).r_c2, 1)}、3板 ${pct(hist(3).r_c2, 1)}、4板 ${pct(hist(4).r_c2, 1)}，第二天收盘卖，已扣费）。
    我测了 ${g.tested || 561} 种条件组合，没有找到前后两段都稳定赚钱的规则，所以这里<b>只做梯队观察，不给买入推荐</b>。</div>`;
  h += `<div class="card"><div class="grid3">
    <div><b>${B.height || "—"}板</b><span>最高板</span></div>
    <div><b>${(B.ladder || []).length}</b><span>连板股（≥2板）</span></div>
    <div><b>${B.broken_count ?? "—"}</b><span>今日断板</span></div></div>
    <table style="margin-top:10px"><tr><th>晋级</th><th>今天</th><th>历史平均</th></tr>
    ${(B.levels || []).map(x => { const hv = hist(x.k).promote; const strong = hv != null && x.rate > hv;
      return `<tr><td>${x.k === 1 ? "首板" : x.k + "板"} → ${x.k + 1}板</td><td class="${strong ? "up" : "down"}">${x.up}/${x.n} = ${(x.rate * 100).toFixed(0)}%</td>
        <td>${hv == null ? "—" : (hv * 100).toFixed(0) + "%"}</td></tr>`; }).join("")}</table>
    <p class="small mute">今天晋级率高于历史平均（红色）说明接力情绪偏强，低于（绿色）说明偏弱。</p></div>`;
  const groups = {};
  (B.ladder || []).forEach(x => (groups[x.k] = groups[x.k] || []).push(x));
  Object.keys(groups).map(Number).sort((a, b) => b - a).forEach(k => {
    const hv = hist(k);
    h += `<div class="h2">${k}板（${groups[k].length}只）<span class="small mute" style="font-weight:400"> · 历史：明天晋级 ${hv.promote == null ? "—" : (hv.promote * 100).toFixed(0) + "%"}，开盘追买平均 ${pct(hv.r_c2, 1)}、胜率 ${hv.win_c2 == null ? "—" : (hv.win_c2 * 100).toFixed(0) + "%"}</span></div><div class="card list">`;
    h += groups[k].map(x => `<div class="it"><div class="l"><b>${esc(x.name || x.code.slice(2))}</b> <span class="small mute">${x.code.slice(2)}</span>
        ${x.yizi ? `<span class="tag">一字</span>` : ""}<br><span class="small mute">${esc(x.sector)}${x.concept ? " · " + esc(x.concept) : ""} · 成交 ${num(x.amt_yi, 1)}亿 · ${esc(x.start || "")} 起</span>
        ${x.main_net != null ? `<br><span class="small">主力 <b class="${cls(x.main_net)}">${x.main_net > 0 ? "+" : ""}${x.main_net.toFixed(2)}亿</b>${x.main_pct != null ? `（${x.main_pct}%）` : ""} · 机构${x.pro_n || 0}家</span>` : ""}</div>
        <div class="r"><button class="btn sec" style="padding:6px 10px;font-size:12px" data-ths="${x.code.slice(2)}">同花顺</button></div></div>`).join("");
    h += `</div>`;
  });
  if ((B.broken || []).length) h += `<details class="card"><summary>今日断板 ${B.broken_count} 只</summary><div class="list">${B.broken.map(x =>
      `<div class="it"><div class="l"><b>${esc(x.name || x.code.slice(2))}</b> <span class="small mute">${x.code.slice(2)} · 昨天${x.k}板</span></div><div class="r"><b class="${cls(x.chg)}">${pct(x.chg)}</b></div></div>`).join("")}</div></details>`;
  return h;
}

function renderFirst(B) {
  const m = B.market || {}, M = B.model || {};
  let h = "";
  h += `<div class="banner info">${B.morning ? `<b>竞价已更新（${esc(B.morning.time)}）</b>：${esc(B.morning.note || "")}` :
        `以下是 <b>${esc(B.asof)}</b> 收盘后的首板，计划<b>下一个交易日开盘</b>买入；9:26 左右会用竞价价格更新买入建议。`}</div>`;
  h += `<div class="card"><div class="grid3">
      <div><b>${m.shouban ?? "—"}</b><span>今日首板（非一字）</span></div>
      <div><b>${m.limit_ups ?? "—"}</b><span>涨停家数</span></div>
      <div><b>${m.zb_rate == null ? "—" : (m.zb_rate * 100).toFixed(0) + "%"}</b><span>炸板率</span></div></div>
    <div class="small" style="margin-top:10px"><b>超跌反弹板块</b>（5日跌≥3%、今天涨≥2%）</div>
    ${(B.rebound || []).length ? `<div class="secchips">${B.rebound.map(x => `<span class="secchip">${esc(x.name)} ${pct(x.ret)}（5日${pct(x.ret5)}，涨停${x.lu}）</span>`).join("")}</div>`
      : `<div class="small mute">今天没有满足条件的板块，所以没有推荐。</div>`}
    <div class="small" style="margin-top:12px"><b>今日热门概念</b>（按概念内涨停家数）</div>
    <div class="secchips">${(B.hot_concepts || []).slice(0, 6).map(x => `<span class="secchip con">${esc(x.name)} ${pct(x.ret)} · 涨停${x.lu}（5日${pct(x.ret5)}）</span>`).join("") || `<span class="small mute">暂无</span>`}</div>
    ${(B.rebound_concepts || []).length ? `<div class="small" style="margin-top:10px"><b>超跌反弹概念</b>（5日跌≥3%、今天涨≥2%，共 ${B.rebound_concepts_count} 个）</div>
      <div class="secchips">${B.rebound_concepts.map(x => `<span class="secchip">${esc(x.name)} ${pct(x.ret)}（5日${pct(x.ret5)}，涨停${x.lu}）</span>`).join("")}</div>` : ""}
    <details><summary>今天涨幅最大的行业</summary><div class="secchips">${(B.hot || []).map(x =>
      `<span class="secchip cold">${esc(x.name)} ${pct(x.ret)}（5日${pct(x.ret5)}）</span>`).join("")}</div>
      <p class="small mute">注意：前5天已经大涨的热门板块，里面的首板历史上次日买入是亏的。</p></details></div>`;
  const picks = B.picks || [];
  h += `<div class="h2">推荐首板 ${picks.length}</div>`;
  if (!picks.length) h += `<div class="card empty">今天没有符合规则的首板。<br><span class="small">一年大约只有 20–30 个交易日会出信号，没有信号时不买。</span></div>`;
  picks.forEach(p => h += sbCard(p, M));
  const others = B.others || [];
  if (B.others_count) {
    h += `<details class="card"><summary>其他首板 ${B.others_count} 只（不符合板块条件，不推荐）</summary><div class="list">` +
      others.map(o => `<div class="it"><div class="l"><b>${esc(o.name || o.code.slice(2))}</b> <span class="small mute">${o.code.slice(2)} · ${esc(o.sector)}</span><br>
        <span class="small mute">${(o.why_not || []).map(esc).join("；")}${o.concepts && o.concepts[0] ? `；热门概念：${esc(o.concepts[0].name)} ${pct(o.concepts[0].ret)}` : ""}</span></div>
        <div class="r"><b class="tier-${o.tier}">${o.index}</b><br><span class="small mute">指数</span></div></div>`).join("") +
      `</div><p class="small mute">这类首板历史上（2022–2026）次日开盘买入、第3天卖出，即使指数高的平均也在亏损。</p></details>`;
  }
  h += renderSbPaper();
  const bt = M.bt;
  if (bt) {
    h += `<div class="card"><b>这个规则的历史回测</b>
      <p class="small">${esc(bt.period)}：符合规则的首板 ${bt.n} 笔，胜率 ${(bt.win * 100).toFixed(0)}%，平均每笔 <b class="${cls(bt.mean)}">${pct(bt.mean, 1)}</b>（已扣费）。</p>
      <p class="small">按“低开优先、每天最多5只”模拟账户：年化 <b class="${cls(bt.cagr)}">${pct(bt.cagr, 1)}</b>，最大回撤 <b class="down">${pct(bt.mdd, 0)}</b>；2022–2026 单独看年化 ${pct(bt.oos_cagr, 1)}。</p>
      <p class="small">逐年：${Object.entries(bt.years).map(([y, v]) => `${y.slice(2)}年 <span class="${cls(v)}">${pct(v, 0)}</span>`).join("，")}</p>
      <p class="small mute">对比：不看板块、所有首板次日开盘买，平均每笔 ${pct(bt.all_shouban_mean, 1)}。回测不代表未来，2026 年至今是亏的。</p></div>`;
  }
  return h;
}

function sbCard(p, M) {
  const code = p.code.slice(2);
  const ts = (M.tiers || {})[p.tier] || {};
  const col = p.tier === "高" ? "var(--up)" : p.tier === "中" ? "var(--gold)" : "#b8b2a7";
  let v = "";
  if (p.verdict) {
    const buy = p.verdict === "买入";
    v = `<div class="vd ${buy ? "buy" : "skip"}">竞价 ${p.gap1 == null ? "—" : pct(p.gap1)} → <b>${esc(p.verdict)}</b>${p.order && buy ? `（第 ${p.order} 顺位）` : ""}</div>`;
  }
  const gb = (g) => g == null ? -1 : g <= -0.02 ? 0 : g <= 0 ? 1 : g <= 0.02 ? 2 : g <= 0.04 ? 3 : g <= 0.07 ? 4 : 5;
  const hit = gb(p.gap1);
  const gaps = (M.gaps || []).map((x, i) => `<tr class="${i === hit ? "hit" : ""}"><td>${esc(x.label)}</td><td>${(x.win * 100).toFixed(0)}%</td>
      <td class="${cls(x.mean)}">${pct(x.mean, 1)}</td><td>${i === 5 ? "放弃" : "可买，低开优先"}</td></tr>`).join("");
  return `<div class="card stock">
    <div class="row"><div><span class="nm">${esc(p.name || code)}</span>${p.name ? `<span class="cd">${code}</span>` : ""}</div>
      <span class="tag">${esc(p.sector)}</span></div>
    ${p.con_rebound ? `<div class="tags"><span class="tag res">行业+概念共振</span><span class="tag ok">${(p.con_rebound_names || []).map(esc).join("、")} 也在超跌反弹</span></div>` : ""}
    <div class="idx"><div><div class="num tier-${p.tier}">${p.index}</div><div class="small mute">推荐指数</div></div>
      <div style="flex:1"><div class="bar"><i style="width:${p.index}%;background:${col}"></i></div>
      <div class="small" style="margin-top:4px"><b class="tier-${p.tier}">${p.tier}档</b> · 同档历史胜率 <b>${ts.win == null ? "—" : (ts.win * 100).toFixed(0) + "%"}</b>，平均 <b class="${cls(ts.mean)}">${pct(ts.mean, 1)}</b></div></div></div>
    <div class="kv">
      <div><span>板块今天</span><b class="${cls(p.sec_ret)}">${pct(p.sec_ret)}</b></div>
      <div><span>板块5日</span><b class="${cls(p.sec_ret5)}">${pct(p.sec_ret5)}</b></div>
      <div><span>板块排名/涨停</span><b>${p.sec_rank} / ${p.sec_lu}只</b></div>
      <div><span>个股20日</span><b class="${cls(p.ret20)}">${pct(p.ret20)}</b></div>
      <div><span>成交额</span><b>${num(p.amt_yi, 1)}亿</b></div>
      <div><span>板块龙头</span><b>${p.leader ? "是" : "否"}</b></div>
    </div>
    <div class="small mute" style="margin-top:10px">所属概念（按今天概念内涨停数排）</div>
    <div class="conrow">${(p.concepts || []).map(c => `<span class="secchip con">${esc(c.name)} ${pct(c.ret)} · 涨停${c.lu}（5日${pct(c.ret5)}）</span>`).join("") || `<span class="small mute">无题材概念</span>`}</div>
    ${conLine(p, M)}
    ${mainBlock(p, M)}
    ${v}
    <details><summary>次日分析：按竞价开盘怎么做</summary>
      <table class="gaptbl"><tr><th>次日竞价</th><th>历史胜率</th><th>平均</th><th>规则</th></tr>${gaps}</table>
      <p class="small mute">开盘涨停买不进；高开超过7%放弃；其余按开盘价买入，同一天低开的优先，最多5只；第3个交易日收盘卖出。收盘价 ${num(p.close)}。</p></details>
    <div class="btns"><button class="btn main" data-ths="${code}">在同花顺打开</button><button class="btn sec" data-copy="${code}">复制代码</button></div>
  </div>`;
}

function mainBlock(p, M) {
  const s = M.main_stats || {};
  const yi = (x) => x == null ? "—" : (x > 0 ? "+" : "") + x.toFixed(2) + "亿";

    </div>
    <p class="small" style="margin:6px 0 0">${many
      ? `机构超过20家：历史上这类首板胜率 ${(ih.win * 100).toFixed(0)}%、平均 ${pct(ih.mean, 1)}，弱于机构少的（${(il.win * 100).toFixed(0)}%、${pct(il.mean, 1)}）。`

function conLine(p, M) {
  const c = M.concept_stats;
  if (!c) return "";
  const a = c.with_con, b = c.without_con;
  return `<p class="small" style="margin:8px 0 0">${p.con_rebound
    ? `历史上“行业+概念同时超跌反弹”的首板：胜率 <b>${(a.win * 100).toFixed(0)}%</b>，平均 <b class="${cls(a.mean)}">${pct(a.mean, 1)}</b>（${a.n} 笔）。`
    : `概念没有一起反弹：历史上这类首板胜率只有 <b>${(b.win * 100).toFixed(0)}%</b>，平均 <b class="${cls(b.mean)}">${pct(b.mean, 1)}</b>（${b.n} 笔），弱于共振的。`}
    <span class="mute">概念成分是现在的名单，历史数字可能偏乐观。</span></p>`;
}

function renderSbPaper() {
  const tr = Object.values(S.sbTrades?.trades || {});
  if (!tr.length) return "";
  const closed = tr.filter(t => t.status === "closed").sort((a, b) => a.exit_date.localeCompare(b.exit_date));
  const open = tr.filter(t => t.status === "open"), pend = tr.filter(t => t.status === "pending");
  const n = closed.length, win = n ? closed.filter(t => t.ret > 0).length / n : null, mean = n ? closed.reduce((s, t) => s + t.ret, 0) / n : null;
  let h = `<div class="h2">首板模拟盘</div><div class="card"><div class="grid3">
    <div><b>${n}</b><span>已结束</span></div><div><b>${win == null ? "—" : (win * 100).toFixed(0) + "%"}</b><span>胜率</span></div>
    <div><b class="${cls(mean)}">${pct(mean, 2)}</b><span>平均每笔</span></div></div>
    ${closed.length >= 2 ? curveSvg(closed) : ""}
    <p class="small mute">从上线起自动记录：次日开盘价买入（开盘涨停或高开超7%不买，每天最多5只、低开优先），第3个交易日收盘卖出，已扣费。</p></div>`;
  const row = (t, right) => `<div class="it"><div class="l"><b>${esc(t.name || t.code.slice(2))}</b> <span class="small mute">${t.code.slice(2)} · ${esc(t.sector || "")}</span><br><span class="small mute">${right[0]}</span></div><div class="r">${right[1]}</div></div>`;
  if (pend.length) h += `<div class="small mute" style="margin:6px 4px">待次日开盘买入 ${pend.length}</div><div class="card list">${pend.map(t => row(t, [`${t.date} 首板 · 待次日开盘`, `<span class="small mute">指数 ${t.index}</span>`])).join("")}</div>`;
  if (open.length) h += `<div class="small mute" style="margin:6px 4px">持有中 ${open.length}</div><div class="card list">${open.map(t => row(t, [`${t.entry_date} 买入 ${num(t.entry)} · 已持 ${t.held ?? 0} 天`, `<b class="${cls(t.ret)}">${pct(t.ret)}</b>`])).join("")}</div>`;
  if (closed.length) h += `<details class="card"><summary>已结束 ${closed.length} 笔</summary><div class="list">${[...closed].reverse().slice(0, 60).map(t => row(t,
      [`${t.entry_date} → ${t.exit_date} · ${num(t.entry)} → ${num(t.exit)}`, `<b class="${cls(t.ret)}">${pct(t.ret)}</b>`])).join("")}</div></details>`;
  return h;
}

// ------------------------------------------------------------------ 模拟盘
function stats(list) {
  const closed = list.filter(t => t.status === "closed");
  const n = closed.length;
  const win = n ? closed.filter(t => t.ret > 0).length / n : null;
  const mean = n ? closed.reduce((s, t) => s + t.ret, 0) / n : null;
  return { n, win, mean, open: list.filter(t => t.status === "open").length };
}

function renderPaper() {
  if (!S.trades) return `<div class="banner info">${esc(S.err || "暂无数据")}</div>`;
  const g = S.paperGroup;
  let list = trList().filter(t => t.groups.includes(g));
  if (!S.paperBackfill) list = list.filter(t => !t.backfill);
  const st = stats(list);
  const closed = list.filter(t => t.status === "closed").sort((a, b) => a.exit_date.localeCompare(b.exit_date));
  let h = `<div class="chips">
    <button class="chip ${g === "base" ? "on" : ""}" data-pg="base">原版</button>
    <button class="chip ${g === "strict" ? "on" : ""}" data-pg="strict">严格版</button>
    <button class="chip ${S.paperBackfill ? "on" : ""}" data-bf="1">${S.paperBackfill ? "含" : "不含"}启动补录</button></div>`;
  h += `<div class="card"><div class="grid3">
      <div><b>${st.n}</b><span>已结束笔数</span></div>
      <div><b>${st.win == null ? "—" : (st.win * 100).toFixed(0) + "%"}</b><span>胜率</span></div>
      <div><b class="${cls(st.mean)}">${pct(st.mean, 2)}</b><span>平均每笔（已扣费）</span></div>
    </div>
    ${closed.length >= 2 ? curveSvg(closed) : ""}
    <p class="small mute">从 app 启动那天起自动记录，按规则假设：选股时（约 14:45）的价格买入，止损/止盈/满 5 天卖出。“启动补录”是第一次运行时用同样规则补记的前 10 个交易日（按收盘价）。</p>
  </div>`;
  const open = list.filter(t => t.status === "open").sort((a, b) => b.date.localeCompare(a.date));
  h += `<div class="h2">持有中 ${open.length}</div><div class="card list">`;
  h += open.length ? open.map(t => `<div class="it"><div class="l"><b>${esc(t.name || t.code.slice(2))}</b>
      ${t.name ? `<span class="small mute"> ${t.code.slice(2)}</span>` : ""}<br><span class="small mute">${t.date} 买入 · 已持 ${t.held ?? 0} 天 · 止损 ${num(t.stop)}</span></div>
      <div class="r"><b class="${cls(t.ret)}">${pct(t.ret)}</b><br><span class="small mute">现价 ${num(t.last)}</span></div></div>`).join("")
    : `<div class="empty">没有持有中的模拟仓位</div>`;
  h += `</div>`;
  const done = [...closed].reverse().slice(0, 60);
  h += `<div class="h2">已结束（最近 ${done.length} 笔）</div><div class="card list">`;
  h += done.length ? done.map(t => `<div class="it"><div class="l"><b>${esc(t.name || t.code.slice(2))}</b>
      ${t.name ? `<span class="small mute"> ${t.code.slice(2)}</span>` : ""}<br><span class="small mute">${t.date} → ${t.exit_date} · ${t.reason}</span></div>
      <div class="r"><b class="${cls(t.ret)}">${pct(t.ret)}</b><br><span class="small mute">${num(t.entry)} → ${num(t.exit)}</span></div></div>`).join("")
    : `<div class="empty">还没有已结束的交易</div>`;
  return h + `</div>`;
}

function curveSvg(closed) {
  let s = 0; const pts = closed.map(t => (s += t.ret));
  const W = 320, H = 90, mn = Math.min(0, ...pts), mx = Math.max(0, ...pts), rng = (mx - mn) || 1;
  const x = (i) => 4 + i * (W - 8) / Math.max(1, pts.length - 1), y = (v) => 6 + (mx - v) * (H - 12) / rng;
  const d = pts.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  return `<div class="small mute" style="margin-top:10px">每笔等额投入的累计盈亏：<b class="${cls(last)}">${pct(last)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:4px">
    <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#d5d0c6" stroke-dasharray="3 3"/>
    <path d="${d}" fill="none" stroke="${last >= 0 ? "var(--up)" : "var(--down)"}" stroke-width="2"/></svg>`;
}

    <div class="grid3" style="margin-top:8px">
      <div><b class="${cls(p.total)}">${pct(p.total, 0)}</b><span>总收益</span></div>
      <div><b class="down">${pct(p.mdd, 0)}</b><span>最大回撤</span></div>

  g.years.forEach(y => h += `<tr><td>${y.year}</td><td>${y.n}</td><td>${y.n ? (y.win * 100).toFixed(0) + "%" : "—"}</td>
      <td class="${cls(y.mean)}">${y.n ? pct(y.mean, 1) : "—"}</td><td class="${cls(y.port)}">${pct(y.port, 0)}</td>
      <td class="${cls(y.csi300)}">${pct(y.csi300, 0)}</td></tr>`);

    <p class="small mute" style="margin:4px">成本：${esc(B.cost)}。数据：${esc(B.data)}。只用日线数据，测不到盘中“T 位”和题材判断，这部分属于主观经验。</p>`;
  return h;
}

function btCurve(curve) {
  const W = 320, H = 130;
  const a = curve.map(c => Math.log(c[1])), b = curve.map(c => Math.log(c[2]));
  const mn = Math.min(...a, ...b), mx = Math.max(...a, ...b), rng = (mx - mn) || 1;
  const x = (i) => 4 + i * (W - 8) / (curve.length - 1), y = (v) => 6 + (mx - v) * (H - 16) / rng;
  const path = (arr) => arr.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const yr = [];
  curve.forEach((c, i) => { if (c[0].endsWith("-12") && i % 2 === 0) yr.push(i); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:10px">
    <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#d5d0c6" stroke-dasharray="3 3"/>
    ${yr.map(i => `<text x="${x(i)}" y="${H - 1}" font-size="9" fill="#9aa0a6" text-anchor="middle">${curve[i][0].slice(0, 4)}</text>`).join("")}
    <path d="${path(b)}" fill="none" stroke="#9aa0a6" stroke-width="1.5"/>
    <path d="${path(a)}" fill="none" stroke="var(--up)" stroke-width="2"/></svg>
    <div class="legend"><span><i style="background:var(--up)"></i>策略账户</span><span><i style="background:#9aa0a6"></i>沪深300</span><span>对数坐标</span></div>`;
}

// ------------------------------------------------------------------ shell
function render() {
  const L = S.latest;
  const hm = L && L.generated ? L.generated.slice(11) : "";
  if (S.tab === "sb" && S.sb) {
    $("#sub").textContent = `首板数据 ${S.sb.asof} 收盘` + (S.sb.generated_morning ? ` · 竞价更新 ${S.sb.generated_morning.slice(11)}` : "");
    $("#app").innerHTML = renderSb();
    document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
    return;
  }
  $("#sub").textContent = L && L.asof
    ? (L.mode === "intraday" ? `${L.asof} 盘中 ${hm} 更新（北京时间）` : `数据日期 ${L.asof} · 收盘后更新于 ${L.generated}（北京时间）`)
    : (S.err ? "等待首次运行" : "加载中…");
  const f = { sb: renderSb, today: renderToday, paper: renderPaper, bt: renderBt, about: renderAbout }[S.tab] || renderSb;
  $("#app").innerHTML = f();
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; try { localStorage.setItem("tab", d.tab); } catch (x) {} render(); window.scrollTo(0, 0); }
  else if (d.tf) { S.todayFilter = d.tf; render(); }
  else if (d.pg) { S.paperGroup = d.pg; render(); }
  else if (d.bf) { S.paperBackfill = !S.paperBackfill; render(); }
  else if (d.bg) { S.btGroup = d.bg; render(); }
  else if (d.sv) { S.sbView = d.sv; render(); }
  else if (d.ths) openThs(d.ths);
  else if (d.copy) onlyCopy(d.copy);
});

(async () => {
  try { const t = localStorage.getItem("tab"); if (t) S.tab = t; } catch (x) {}
  await load(); render();
  if ("serviceWorker" in navigator && !window.__DATA__ && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
