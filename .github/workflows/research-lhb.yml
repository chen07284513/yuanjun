name: research-lhb

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test / full（龙虎榜）或 boards（板块成分）"
        default: "test"
      start:
        default: "2024-01-02"
      end:
        default: "2024-01-10"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 抓取数据
        env:
          MODE: ${{ inputs.mode }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          if [ "$MODE" = "probe" ]; then python -u research/probe_main.py
          elif [ "$MODE" = "holdings" ]; then python -u research/fetch_holdings.py
          elif [ "$MODE" = "boards" ]; then python -u research/fetch_boards.py
          else python -u research/fetch_lhb.py "$MODE" "$START" "$END"; fi
      - name: 保存到 research-data 分支
        if: inputs.mode == 'full' || inputs.mode == 'boards' || inputs.mode == 'holdings'
        run: |
          mkdir -p /tmp/out && cp research/data/*.csv.gz /tmp/out/
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin research-data 2>/dev/null; then
            git checkout -B research-data origin/research-data
          else
            git checkout --orphan research-data
            git rm -rf -q . || true
          fi
          cp /tmp/out/*.csv.gz .
          git add *.csv.gz
          git commit -m "research data: ${{ inputs.mode }}" || true
          git push origin research-data
