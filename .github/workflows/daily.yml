name: daily-pick

on:
  schedule:
    # GitHub 的定时经常晚几十分钟，所以提前启动、在任务里等到准点再跑（公开仓库不耗费用）
    - cron: "10 0 * * 1-5"   # 北京 08:10 启动 → 等到 09:26 首板竞价更新
    - cron: "40 0 * * 1-5"   # 备份
    - cron: "20 5 * * 1-5"   # 北京 13:20 启动 → 等到 14:38 盘中选股
    - cron: "50 5 * * 1-5"   # 备份
    - cron: "30 7 * * 1-5"   # 北京 15:30 启动 → 等到 16:40 收盘后更新
    - cron: "5 8 * * 1-5"    # 备份
  workflow_dispatch:          # 手动运行
  push:
    branches: [main]
    paths: ["docs/**", "!docs/data/**"]   # 改界面时只重新发布页面

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pick
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: 等到准点
        if: github.event_name == 'schedule'
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          case "$SCHED" in
            "10 0 * * 1-5"|"40 0 * * 1-5") T="01:26" ;;
            "20 5 * * 1-5"|"50 5 * * 1-5") T="06:38" ;;
            *) T="08:40" ;;
          esac
          target=$(date -u -d "today $T" +%s); now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then echo "sleep $((target-now))s until $T UTC"; sleep $((target-now)); else echo "already past $T UTC"; fi
          git pull --rebase --quiet origin main || true

      - name: 选股并更新模拟盘
        if: github.event_name != 'push'
        run: python -u picker/daily.py docs/data

      - name: 保存数据
        if: github.event_name != 'push'
        run: |
          git config user.name "daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data picker/names.json picker/flows || git add docs/data picker/names.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase --quiet origin main || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
